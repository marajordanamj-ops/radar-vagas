name: Testar fontes de vagas
on:
  workflow_dispatch:   # só roda quando acionado à mão; não usa o Gemini e não publica nada
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/testar_fontes.mjs
      - name: Coleta real com a configuração atual (sem Gemini)
        env:
          TZ: America/Sao_Paulo
        run: |
          node scripts/coletar.mjs
          node -e "const b=require('./dados/brutas.json');for(const v of b.vagas)console.log('NA JANELA',v.fonte,'|',v.empresa,'|',v.titulo,'|',v.publicadoEm);for(const d of b.preDescartadas)console.log('PRE-DESCARTE',d.fonte,'|',d.empresa,'|',d.cargo,'|',d.motivo)"
