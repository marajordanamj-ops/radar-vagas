name: Radar de vagas
on:
  schedule:
    - cron: "17 11 * * *"  # 08:17 em Brasília, para o site estar pronto às 9h (o GitHub usa UTC e costuma atrasar, mais ainda nas horas cheias)
    - cron: "17 17 * * *"  # 14:17 em Brasília, para o site estar pronto às 15h
  workflow_dispatch:        # permite rodar na hora pelo botão "Run workflow"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Coletar, avaliar e montar o painel
        id: rodada
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CURRICULO_JSON: ${{ secrets.CURRICULO_JSON }}
        run: |
          node scripts/coletar.mjs
          node scripts/avaliar.mjs
          node scripts/gerar_curriculos.mjs
          node scripts/gerar_painel.mjs
      - name: Painel de falha (não mostrar dados velhos)
        if: steps.rodada.outcome == 'failure'
        run: |
          # mantém no ar a última rodada concluída (por exemplo, a das 9h se a das 14h falhar), marcada como antiga
          curl -sf "https://marajordanamj-ops.github.io/radar-vagas/rodada.json" -o dados/rodada.json || rm -f dados/rodada.json
          node scripts/gerar_painel.mjs --falha "A rodada automática das $(date +%H:%M) falhou. Abra a aba Actions do repositório e veja o registro."
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar o site
        id: publicar
        uses: actions/deploy-pages@v4
      - name: Marcar a execução como falha
        if: steps.rodada.outcome == 'failure'
        run: exit 1
